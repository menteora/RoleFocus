name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure GitHub Pages & resolve Base URL
        id: pages
        uses: actions/configure-pages@v5

      - name: Calculate and set BASE_URL environment variable
        id: set-base-url
        shell: bash
        run: |
          # If configure-pages output base_path is provided, use it; otherwise compute from repository name
          PAGES_BASE="${{ steps.pages.outputs.base_path }}"
          if [ -n "$PAGES_BASE" ]; then
            FINAL_BASE="${PAGES_BASE%/}/"
          else
            REPO_NAME="${{ github.event.repository.name }}"
            OWNER="${{ github.repository_owner }}"
            if [ "$REPO_NAME" = "$OWNER.github.io" ]; then
              FINAL_BASE="/"
            else
              FINAL_BASE="/${REPO_NAME}/"
            fi
          fi
          
          # Ensure leading slash
          if [[ "$FINAL_BASE" != /* ]]; then
            FINAL_BASE="/${FINAL_BASE}"
          fi

          echo "Determined BASE_URL: $FINAL_BASE"
          echo "BASE_URL=$FINAL_BASE" >> $GITHUB_ENV
          echo "VITE_BASE_URL=$FINAL_BASE" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          BASE_URL: ${{ env.BASE_URL }}
          VITE_BASE_URL: ${{ env.VITE_BASE_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
